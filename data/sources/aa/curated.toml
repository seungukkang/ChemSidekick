# Hand-entered amino-acid data for BIO-01 `aa` (plan 006).
#
# scripts/build_amino_acids.py checks every structure here against wwPDB CCD,
# PubChem and ChEBI (InChIKey), computes masses from the verified element data,
# and writes src/chemsidekick/tools/biochemistry/data/amino_acids.json.
#
# smiles      neutral L form (as in CCD, PubChem, ChEBI)
# smiles_ph7  the form drawn in 2D: dominant charge state near pH 7 (plan 006 Q5).
#             Must be the same molecule as `smiles` after neutralization.
# class       side-chain class, Lehninger's five groups (plan 006 Q6) + "other"
# pka         [alpha-COOH, alpha-NH3+, side chain or none]: PROVISIONAL, one
#             textbook table (lehninger7), not yet cross-checked (plan 006 Q4)

[references.jcbn1984]
citation = "IUPAC-IUB Joint Commission on Biochemical Nomenclature (JCBN), Nomenclature and Symbolism for Amino Acids and Peptides (Recommendations 1983), Pure Appl. Chem. 1984, 56, 595–624."

[references.ccd]
citation = "wwPDB Chemical Component Dictionary (CCD), J. D. Westbrook et al., Bioinformatics 2015, 31, 1274–1278; files.rcsb.org/ligands."

[references.pubchem]
citation = "PubChem (NCBI), S. Kim et al., Nucleic Acids Res. 2025, 53, D1516–D1525; compound records by CID."

[references.chebi]
citation = "ChEBI (EMBL-EBI), A. Malik et al., Nucleic Acids Res. 2026; compound records by ChEBI ID."

[references.kd1982]
citation = "J. Kyte, R. F. Doolittle, A simple method for displaying the hydropathic character of a protein, J. Mol. Biol. 1982, 157, 105–132 (Table 2)."

[references.expasy]
citation = "ExPASy ProtScale, Amino acid scale: Hydropathicity (Kyte & Doolittle), SIB Swiss Institute of Bioinformatics, web.expasy.org/protscale."

[references.ncbi_gc]
citation = "NCBI, The Genetic Codes, Table 1 (Standard Code), www.ncbi.nlm.nih.gov/Taxonomy/Utils/wprintgc.cgi; gc.prt."

[references.lehninger7]
citation = "D. L. Nelson, M. M. Cox, Lehninger Principles of Biochemistry, 7th ed., W. H. Freeman, 2017, Table 3-1 and Fig. 3-5."

