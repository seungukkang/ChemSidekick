name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  raycast:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/raycast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/raycast/package-lock.json
      - run: npm ci
      # `ray lint` also checks the author against raycast.com, so CI runs
      # ESLint, Prettier and tsc directly instead.
      - run: npm run check
      - run: npx ray build -e dist -o "$RUNNER_TEMP/raycast-build"
