[project]
name = "chemsidekick"
version = "0.2.1"
description = "A personal toolbox of small chemistry calculators and visualizers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seunguk Kang", email = "drkd.319@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "rdkit>=2026.9.1",
    "streamlit>=1.67.0",
    "typer>=0.28.0",
    "ziamath>=0.13",
]

[project.scripts]
csk = "chemsidekick.cli.main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented style: parameters declared with typer.Option(...) defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ziamath (formula typesetting) still calls importlib.resources.path internally.
filterwarnings = ["ignore:path is deprecated:DeprecationWarning:ziamath"]

[dependency-groups]
dev = [
    "certifi>=2026.10.23",
    "mendeleev>=1.3.0",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
