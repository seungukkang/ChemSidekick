[project]
name = "chemsidekick"
version = "0.1.0.dev0"
description = "A personal toolbox of small chemistry calculators and visualizers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seunguk Kang", email = "drkd.319@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "typer>=0.28.0",
]

[project.scripts]
csk = "chemsidekick.cli.main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
